# Signed, notarized release pipeline for Prioritiser.
#
# Triggered by pushing a version tag (v*). Produces a universal (arm64 + x86_64)
# macOS app, code-signed with Developer ID and notarized via the App Store Connect
# API key. Distributed as both .dmg (drag-to-install) and .zip, published to this
# repo's Releases and to the shared roaanv/releases repo.
#
# Required repository secrets (see RELEASE.md / `make gh-secrets`):
#   DEVELOPER_ID_CERTIFICATE_P12       - Base64-encoded .p12 certificate
#   DEVELOPER_ID_CERTIFICATE_PASSWORD  - Password for the .p12
#   APPSTORE_API_KEY_P8_BASE64         - Base64-encoded App Store Connect .p8 key
#   APPSTORE_API_KEY_ID                - Key ID from App Store Connect
#   APPSTORE_API_ISSUER_ID             - Issuer ID from App Store Connect
#   RELEASE_REPO_TOKEN                 - PAT with contents:write on roaanv/releases

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Run tests
        run: make test

  release:
    name: Build & Release
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Setup project
        run: make setup

      # ── Code Signing Certificate Import ──────────────
      - name: Import code signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificate.p12"

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Determine signing identity
        run: |
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "Error: No Developer ID Application identity found"
            exit 1
          fi
          echo "Found: $IDENTITY"
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      # ── Build & Sign ─────────────────────────────────
      - name: Build universal release binary
        run: make release

      - name: Sign application
        run: make sign SIGNING_IDENTITY="$SIGNING_IDENTITY"

      # ── Prepare Notary API Key ───────────────────────
      - name: Prepare API key for notarization
        env:
          API_KEY_P8_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
        run: |
          API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$API_KEY_P8_BASE64" | base64 --decode > "$API_KEY_PATH"
          echo "API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"

      # ── Notarize & staple .app ───────────────────────
      # After this step the .app carries its own stapled ticket, so both
      # packaging steps below produce artifacts with a stapled .app inside.
      - name: Notarize and staple .app
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          make notarize-app \
            API_KEY_PATH="$API_KEY_PATH" \
            API_KEY_ID="$API_KEY_ID" \
            API_ISSUER_ID="$API_ISSUER_ID"

      # ── Package: DMG ─────────────────────────────────
      - name: Create DMG
        run: make dmg TAG=${{ github.ref_name }}

      - name: Notarize and staple DMG
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          make notarize-dmg \
            NOTARIZE_PATH="build/Prioritiser-${{ github.ref_name }}-universal.dmg" \
            API_KEY_PATH="$API_KEY_PATH" \
            API_KEY_ID="$API_KEY_ID" \
            API_ISSUER_ID="$API_ISSUER_ID"

      # ── Package: ZIP ─────────────────────────────────
      # A ZIP is just a container for the stapled .app — ZIPs can't be stapled,
      # so no separate notarization is needed.
      - name: Create ZIP archive
        run: make archive TAG=${{ github.ref_name }}

      # ── Publish Release ──────────────────────────────
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/Prioritiser-${{ github.ref_name }}-universal.dmg
            build/Prioritiser-${{ github.ref_name }}-universal.zip

      - name: Publish to public releases repo
        uses: softprops/action-gh-release@v2
        with:
          repository: roaanv/releases
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          tag_name: prioritiser-${{ github.ref_name }}
          name: prioritiser ${{ github.ref_name }}
          files: |
            build/Prioritiser-${{ github.ref_name }}-universal.dmg
            build/Prioritiser-${{ github.ref_name }}-universal.zip

      # ── Cleanup ──────────────────────────────────────
      - name: Clean up signing artifacts
        if: always()
        run: |
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          if [ -n "$API_KEY_PATH" ] && [ -f "$API_KEY_PATH" ]; then
            rm -f "$API_KEY_PATH"
          fi
