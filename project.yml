# xcodegen manifest for Prioritiser.
# The generated .xcodeproj is NOT committed (see .gitignore); run `make setup`
# or `xcodegen generate` to (re)create it from this file.
name: Prioritiser

options:
  bundleIdPrefix: io.0112
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    # Swift 6 language mode: complete data-race safety / strict concurrency.
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.5"
    CURRENT_PROJECT_VERSION: "1"
    # Local development: ad-hoc sign, no provisioning required.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO

targets:
  Prioritiser:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.0112.Prioritiser
        PRODUCT_NAME: Prioritiser
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: Prioritiser
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        # Standard windowed app (not a background agent).
        LSUIElement: false
    scheme:
      testTargets:
        - PrioritiserTests
      gatherCoverageData: true

  PrioritiserTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Prioritiser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.0112.PrioritiserTests
        GENERATE_INFOPLIST_FILE: YES
